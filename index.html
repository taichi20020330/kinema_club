<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a1015">
<meta name="description" content="友達と観たい映画をリクエストし合う映画会のリスト">
<title>映画会のみたいリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 昭和の映画館ロビー。上に赤い幕、電球の看板、その下に真鍮枠のポスターケースが2列。動くものはなし。 */
:root{
  --paper:#f3ebdc;      /* ロビーの壁 */
  --ink:#21160f;        /* 墨 */
  --velvet:#8c1c22;     /* ビロード */
  --velvet-d:#5a1015;
  --brass:#b48a3e;      /* 真鍮 */
  --bulb:#ffd98a;       /* 電球 */
  --sub:#7d6b57;
  --line:#dccdb2;
  --tile:#e8dcc6;
  --f-sign:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --f:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{overflow-x:clip}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(40px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* 赤い幕 */
.valance{height:34px;width:100vw;margin-left:calc(50% - 50vw);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 3px,transparent 3px 20px) 0 0/100% 14px no-repeat,
    radial-gradient(circle at 50% 0,var(--velvet) 15px,transparent 15.5px) 0 12px/30px 22px repeat-x,
    linear-gradient(var(--velvet-d),var(--velvet)) 0 0/100% 14px no-repeat;
  border-top:4px solid var(--brass)}

/* 電球の看板 */
.marquee{position:relative;background:var(--ink);color:var(--bulb);text-align:center;padding:22px 18px 18px;border:3px solid var(--brass);border-radius:6px}
.marquee::before{content:"";position:absolute;inset:6px;border:5px dotted var(--bulb);border-radius:3px;pointer-events:none;opacity:.9}
.mq-top{font-family:var(--f-sign);font-size:12px;letter-spacing:.4em;color:#e9c77f}
h1{font-family:var(--f-sign);font-weight:400;font-size:clamp(26px,7.4vw,40px);line-height:1.25;margin:6px 0 4px;letter-spacing:.08em;color:#fff3d6;text-wrap:balance;
  text-shadow:0 0 10px rgba(255,217,138,.45)}
h1 span{display:inline-block}
.count{font-size:13px;color:#d9c49a;font-variant-numeric:tabular-nums}

/* 切符の形のボタン */
.ticket{font-family:var(--f-sign);font-size:17px;letter-spacing:.12em;background:var(--velvet);color:#fff3d6;border:0;cursor:pointer;
  padding:14px 28px;min-height:52px;align-self:center;width:min(100%,340px);position:relative;
  -webkit-mask:radial-gradient(circle 8px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 8px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket::after{content:"";position:absolute;inset:5px 14px;border:1px dashed rgba(255,243,214,.55);pointer-events:none}

.who{font-size:13px;color:var(--sub);text-align:center}
.who button{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0 0 0 4px}

.tabs{display:flex;gap:18px;justify-content:center;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:8px 0;margin-bottom:-1px;cursor:pointer;flex:none}
.tab.on{color:var(--velvet);border-bottom-color:var(--velvet);font-weight:700}

/* 真鍮枠のポスターケース */
/* 横一列にずらっと並べる（左端から始まり、スワイプで流す） */
.grid{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  width:100vw;margin-left:calc(50% - 50vw);
  padding:6px max(16px,calc(50vw - 360px)) 18px;scroll-padding-inline:max(16px,calc(50vw - 360px));scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.grid .item{flex:0 0 min(40vw,190px);scroll-snap-align:start}
main{display:flex;flex-direction:column;gap:18px}
.shelf{display:flex;flex-direction:column;gap:4px}
.shelf-h{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.shelf-h h2{font-family:var(--f-sign);font-weight:400;font-size:17px;letter-spacing:.12em;margin:0}
.grid.small .item{flex-basis:min(28vw,130px)}
.grid.small .t{font-size:13px}
.grid.small .dir{font-size:12px}
.grid.small .pic{border-width:2px;padding:3px}
.grid.small .pic .noimg{inset:3px;font-size:13px;padding:8px}
.grid.small .item.watched .pic::after{font-size:12px;padding:0 5px;border-width:1px}
.slidebar{display:flex;align-items:center;gap:8px}
.slidebar button{font:inherit;font-size:18px;line-height:1;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.slidebar button:disabled{opacity:.3;cursor:default}
@media (pointer:coarse){.slidebar{display:none}}
.item{display:flex;flex-direction:column;gap:8px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.pic{position:relative;aspect-ratio:2/3;background:var(--ink);border:3px solid var(--brass);border-radius:3px;padding:5px;
  box-shadow:0 0 0 1px #7a5a22,0 8px 14px rgba(60,35,10,.22)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .noimg{position:absolute;inset:5px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  background:var(--velvet);color:#fff3d6;font-family:var(--f-sign);font-size:18px;line-height:1.45;word-break:break-word;letter-spacing:.06em;
  box-shadow:inset 0 0 0 4px var(--velvet),inset 0 0 0 5px rgba(255,217,138,.6)}
.item.watched .pic img,.item.watched .pic .noimg{filter:grayscale(1) brightness(.55)}
.item.watched .pic::after{content:"上映終了";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);
  font-family:var(--f-sign);font-size:18px;color:#fff3d6;border:2px solid #fff3d6;padding:0 8px;letter-spacing:.1em;white-space:nowrap;background:var(--ink);z-index:1}
.t{font-family:var(--f-sign);font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dir{font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.by{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.notice{font-size:13px;color:var(--sub);text-align:center}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(33,22,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:14px 14px 0 0;border-top:4px solid var(--velvet);
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:10px}}
.sheet h2{font-family:var(--f-sign);font-weight:400;font-size:22px;margin:0;padding-right:32px;line-height:1.35;word-break:break-word;letter-spacing:.04em}
.close{position:absolute;right:10px;top:10px;background:none;border:0;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;padding:6px 10px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
label small{font-weight:400;color:var(--sub)}
input[type=text],textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fffaf0;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.drop{border:1px dashed #bfa98a;border-radius:6px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fffaf0}
.drop .thumb{width:44px;aspect-ratio:2/3;background:var(--tile) center/cover no-repeat;border-radius:2px;flex:none}
.drop p{margin:0;font-size:13px;font-weight:400;color:var(--sub);min-width:0;word-break:break-all}
.link{font-size:13px;color:var(--velvet);text-decoration:underline;text-underline-offset:3px}
.link[aria-disabled="true"]{color:#c9b89c;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-sign);font-size:16px;letter-spacing:.08em;background:var(--velvet);color:#fff3d6;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;flex:1 1 auto;min-height:46px}
.btn[disabled]{opacity:.5}
.sub-btn{font:inherit;font-size:14px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;min-height:44px}
.sub-btn.danger{color:#a3271e}
.err{color:#a3271e;font-size:13px;margin:0}
.detail-img{width:100%;max-height:44vh;object-fit:contain;background:var(--ink);border:3px solid var(--brass);border-radius:3px;display:block}
.meta{font-size:13px;color:var(--sub)}
.note{margin:0;white-space:pre-wrap;word-break:break-word}

/* 投稿フォームはスマホ1画面に収める */
.sheet.compact{gap:10px;padding-top:16px;max-height:100dvh}
.compact h2{font-size:19px}
.compact label{gap:4px;font-size:12px}
.compact input[type=text],.compact textarea{font-weight:400}
.compact input[type=text]{padding:9px 11px}
.compact textarea{min-height:0;height:62px;padding:9px 11px}
.as{font-size:13px;color:var(--sub)}
.as span{color:var(--ink);font-weight:700}
.as button{font:inherit;background:none;border:0;color:var(--velvet);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0 0 0 8px}
.imgrow{display:flex;align-items:center;gap:12px}
.imgrow .drop{flex:1 1 auto;min-width:0;padding:7px 10px;gap:10px}
.imgrow .thumb{width:26px}
.imgrow .link{flex:none}
#pasteSlot:empty{display:none}
.pastezone{white-space:nowrap;outline:none;caret-color:transparent;-webkit-user-select:text;user-select:text;background:#fffaf0}
.pastezone:focus{border-color:var(--velvet)}
.paste{flex:none;font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--ink);cursor:pointer}
.drop p small{color:var(--sub);font-weight:400}

/* 感想 */
.reviews{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.reviews h3{font-family:var(--f-sign);font-weight:400;font-size:17px;margin:0;letter-spacing:.08em}
.reviews h3 small{font-family:var(--f);font-size:12px;color:var(--sub);margin-left:6px;letter-spacing:0}
.rv{background:#fffaf0;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.rv-h{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--sub)}
.rv-h b{color:var(--ink);font-size:13px}
.rv-del{margin-left:auto;font:inherit;font-size:12px;background:none;border:0;color:#a3271e;cursor:pointer;padding:0}
.rv p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.rv-empty{margin:0;font-size:13px;color:var(--sub)}
.rv-form{display:flex;gap:8px;align-items:flex-end}
.rv-form textarea{flex:1 1 auto;min-height:0;height:48px;font-size:16px}
.rv-form .btn{flex:none;min-height:48px;padding:10px 16px}

/* 上映日時 */
.sched{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:2px 0 8px;font-family:var(--f-sign);font-size:15px;letter-spacing:.1em;color:var(--bulb)}
.sched span+span::before{content:"／";margin-right:14px;color:#8c7445}
/* ポップコーン */
.pops{display:flex;align-items:center;flex-wrap:nowrap;gap:3px;min-height:20px;font-size:12px;color:var(--sub)}
.pops .lbl{margin-right:4px}
.pops i{display:block;width:9px;height:9px;border-radius:50%;background:#9c958b}
.pops em{font-style:normal;margin-left:3px}
.grid.small .pops{display:none}
.vote-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.vote-line .pops i{width:11px;height:11px}
.pop-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pop-fly{position:absolute;left:0;top:0;will-change:transform,opacity;filter:drop-shadow(0 2px 2px rgba(60,35,10,.3))}

button:focus-visible,input:focus-visible,textarea:focus-visible,.drop:focus-visible,.link:focus-visible{outline:2px solid var(--velvet);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="valance" aria-hidden="true"></div>
  <header class="marquee">
    <div class="mq-top">KINEMA CLUB ・ 本日上映</div>
    <h1><span>映画会の</span><span>みたいリスト</span></h1>
    <div class="sched"><span>月曜日</span><span>19:30 開場</span><span>20:00 上映</span></div>
    <div class="count" id="count">読み込み中…</div>
  </header>
  <button class="ticket" id="openPost" type="button">上映リクエスト</button>
  <div class="who" id="who"></div>

  <nav class="tabs" aria-label="並び順">
    <button class="tab on" data-f="all" type="button">新しい順</button>
    <button class="tab" data-f="top" type="button">人気順</button>
  </nav>

  <main aria-live="polite">
    <section class="shelf">
      <div class="shelf-h"><h2>上映予定</h2><div class="slidebar" data-for="grid"><button type="button" class="prev" aria-label="前へ">‹</button><button type="button" class="next" aria-label="次へ">›</button></div></div>
      <div class="grid" id="grid" aria-label="上映予定（横にスワイプ）"></div>
      <p class="empty" id="empty">まだ何もありません。「上映リクエスト」から観たい映画を入れてください。</p>
    </section>
    <section class="shelf" id="doneShelf" hidden>
      <div class="shelf-h"><h2>上映終了</h2><div class="slidebar" data-for="gridDone"><button type="button" class="prev" aria-label="前へ">‹</button><button type="button" class="next" aria-label="次へ">›</button></div></div>
      <div class="grid small" id="gridDone" aria-label="上映終了（横にスワイプ）"></div>
    </section>
  </main>
  <p class="notice" id="notice" hidden></p>
</div>

<div class="sheet-bg" id="postSheet" hidden>
  <form class="sheet compact" id="postForm" novalidate>
    <button class="close" type="button" data-close aria-label="閉じる">×</button>
    <h2>上映リクエスト</h2>
    <div class="as" id="asRow" hidden><span id="asName"></span> としてリクエスト<button type="button" id="asChange">変更</button></div>
    <label for="fName" id="nameRow">あなたの名前
      <input type="text" id="fName" maxlength="20" autocomplete="nickname">
    </label>
    <label for="fTitle">タイトル
      <input type="text" id="fTitle" maxlength="80" placeholder="例：東京物語" enterkeyhint="next">
    </label>
    <label for="fDir"><span>監督・作者 <small>任意</small></span>
      <input type="text" id="fDir" maxlength="60" enterkeyhint="next">
    </label>
    <label for="fNote"><span>おすすめポイント・なぜみたいか <small>任意</small></span>
      <textarea id="fNote" maxlength="300" rows="2"></textarea>
    </label>
    <div class="imgrow">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="ポスター画像を選ぶ">
        <div class="thumb" id="thumb"></div>
        <p id="dropText">ポスター画像 <small>任意</small></p>
      </div>
      <span id="pasteSlot"></span>
      <a class="link" id="findLink" href="#" target="_blank" rel="noopener" aria-disabled="true">画像検索 ↗</a>
      <input type="file" id="fImg" accept="image/*" hidden>
    </div>
    <p class="err" id="postErr" hidden></p>
    <div class="row"><button class="btn" type="submit" id="postBtn">リクエストする</button></div>
  </form>
</div>

<div class="sheet-bg" id="detailSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="dBody"></div>
</div>

<div class="sheet-bg" id="nameSheet" hidden>
  <form class="sheet" id="nameForm" novalidate>
    <button class="close" type="button" data-close aria-label="閉じる">×</button>
    <h2>あなたの名前</h2>
    <label for="nName">みんなに表示されます
      <input type="text" id="nName" maxlength="20" autocomplete="nickname">
    </label>
    <p class="err" id="nameErr" hidden></p>
    <div class="row"><button class="btn" type="submit">決定</button></div>
  </form>
</div>
<input type="file" id="addImg" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL = "https://fuaumbxipcroejporbcg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_yAgAOdNYXqDnwzziW_4EGw_8iDoqm6d";
  const BUCKET = "posters";

  const $ = s => document.querySelector(s);
  const store = {
    get(k){ try { return localStorage.getItem(k) || ""; } catch(_){ return ""; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch(_){} }
  };
  let localId = store.get("mn_id");
  if (!localId){ localId = "d_" + Math.random().toString(36).slice(2, 12); store.set("mn_id", localId); }
  const state = { movies: [], filter: "all", me: localId, myName: store.get("mn_name"), sb: null, openId: null, file: null, afterName: null };

  const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const imgSrc = m => m.image_path ? `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(m.image_path)}` : "";
  const searchUrl = t => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(t + " 映画 ポスター");
  const dirOf = m => (m.year || "").trim();
  const fmtDate = x => { const d = new Date(x); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const reviewsReady = () => !state.noReviews;
  const reviewsOf = m => (m.reviews || []).slice().sort((a,b) => Date.parse(a.created_at) - Date.parse(b.created_at));
  async function addReview(movie_id, body){
    const { error } = await state.sb.from("reviews").insert({ movie_id, name: state.myName, author_id: state.me, body });
    if (error) throw error; await load();
  }
  async function delReview(id){
    const { error } = await state.sb.from("reviews").delete().eq("id", id);
    if (error) throw error; await load();

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function popsHTML(n, max = 8){
    if (!n) return "";
    const show = Math.min(n, max);
    return `<span class="lbl">みたい</span>` + "<i></i>".repeat(show) + (n > show ? `<em>+${n - show}</em>` : "");
  }
  // 画面のある位置からポップコーンを弾けさせる（重力つきの放物線）
  function popBurst(x, y, n){
    if (reduceMotion) return;
    const layer = document.createElement("div"); layer.className = "pop-layer"; document.body.appendChild(layer);
    const G = 2000, DRAG = 0.35, LIFE = 2.6;
    const ps = [];
    for (let i = 0; i < n; i++){
      const img = document.createElement("img");
      img.src = POPS[(Math.random() * POPS.length) | 0]; img.alt = ""; img.className = "pop-fly";
      const size = 22 + Math.random() * 24; img.style.width = img.style.height = size + "px";
      layer.appendChild(img);
      const ang = -Math.PI / 2 + (Math.random() - .5) * 1.5;   // ほぼ真上を中心に左右へ
      const sp = 520 + Math.random() * 520;                    // 初速 px/s
      ps.push({ img, size, x: x - size / 2, y: y - size / 2, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        rot: Math.random() * 360, vr: (Math.random() - .5) * 900, delay: Math.random() * .08, t: 0, done: false });
    }
    let last = performance.now();
    function frame(now){
      const dt = Math.min(.033, (now - last) / 1000); last = now;
      let alive = 0;
      for (const p of ps){
        if (p.done) continue;
        p.t += dt;
        if (p.t < p.delay){ p.img.style.opacity = 0; alive++; continue; }
        p.vy += G * dt;
        p.vx *= 1 - DRAG * dt; p.vy *= 1 - DRAG * dt * .3;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const age = p.t - p.delay;
        const sc = Math.min(1, .35 + age * 6);
        const op = age > LIFE - .4 ? Math.max(0, (LIFE - age) / .4) : 1;
        p.img.style.opacity = op;
        p.img.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.rot}deg) scale(${sc})`;
        if (p.y > innerHeight + 80 || age > LIFE){ p.done = true; p.img.remove(); } else alive++;
      }
      if (alive) requestAnimationFrame(frame); else layer.remove();
    }
    requestAnimationFrame(frame);
  }
  function celebrate(){
    const r = $("#openPost").getBoundingClientRect();
    const onScreen = r.bottom > 0 && r.top < innerHeight;
    popBurst(onScreen ? r.left + r.width / 2 : innerWidth / 2, onScreen ? r.top + r.height / 2 : innerHeight * .45, 26);
  }
  const votesOf = m => (m.votes && typeof m.votes === "object") ? m.votes : {};
  const voteCount = m => Object.keys(votesOf(m)).length;
  const ts = m => m.created_at ? Date.parse(m.created_at) : 0;
  const saveError = () => "保存できませんでした。通信状況を確認してもう一度試してください。";

  // ---- 名前 ----
  function setName(n){ state.myName = n; store.set("mn_name", n); renderWho(); }
  function renderWho(){
    $("#who").innerHTML = state.myName
      ? `${esc(state.myName)} として参加中<button type="button" id="chgName">変更</button>`
      : `<button type="button" id="chgName">名前を設定する</button>`;
    $("#chgName").onclick = () => askName(null);
  }
  function askName(then){
    state.afterName = then;
    $("#nName").value = state.myName; $("#nameErr").hidden = true;
    $("#nameSheet").hidden = false; setTimeout(() => $("#nName").focus(), 30);
  }
  $("#nameForm").addEventListener("submit", e => {
    e.preventDefault();
    const n = $("#nName").value.trim();
    if (!n){ const el = $("#nameErr"); el.textContent = "名前を入れてください。"; el.hidden = false; return; }
    setName(n); $("#nameSheet").hidden = true;
    const f = state.afterName; state.afterName = null; if (f) f();
  });

  // ---- 一覧 ----
  function sorted(list){
    if (state.filter === "top") return list.sort((a,b) => voteCount(b) - voteCount(a) || ts(b) - ts(a));
    return list.sort((a,b) => ts(b) - ts(a));
  }
  function makeItem(m){
    const b = document.createElement("button");
    b.type = "button"; b.className = "item" + (m.watched ? " watched" : "");
    const n = voteCount(m);
    const pic = document.createElement("div"); pic.className = "pic";
    const noimg = () => { const d = document.createElement("div"); d.className = "noimg"; d.textContent = m.title; return d; };
    if (m.image_path){
      const img = document.createElement("img"); img.alt = ""; img.loading = "lazy"; img.src = imgSrc(m);
      img.onerror = () => { img.remove(); pic.appendChild(noimg()); };
      pic.appendChild(img);
    } else pic.appendChild(noimg());
    const t = document.createElement("div"); t.className = "t"; t.textContent = m.title;
    const dir = document.createElement("div"); dir.className = "dir"; dir.textContent = dirOf(m); dir.hidden = !dirOf(m);
    const by = document.createElement("div"); by.className = "by";
    const rc = reviewsOf(m).length;
    by.textContent = [m.by_name, rc ? `感想 ${rc}` : ""].filter(Boolean).join("・");
    const pops = document.createElement("div"); pops.className = "pops"; pops.innerHTML = popsHTML(n);
    if (n) pops.setAttribute("aria-label", `みたい ${n}人`);
    b.append(pic, t, dir, pops, by);
    b.addEventListener("click", () => openDetail(m.id));
    return b;
  }
  function render(){
    const want = sorted(state.movies.filter(m => !m.watched));
    const done = sorted(state.movies.filter(m => m.watched));
    $("#count").textContent = state.movies.length ? `${state.movies.length}本・まだ観てない ${want.length}本` : "0本";
    const grid = $("#grid"), gridDone = $("#gridDone");
    grid.innerHTML = ""; gridDone.innerHTML = "";
    want.forEach(m => grid.appendChild(makeItem(m)));
    done.forEach(m => gridDone.appendChild(makeItem(m)));
    $("#empty").hidden = want.length > 0;
    if (!want.length && state.movies.length) $("#empty").textContent = "上映予定の映画はありません。「上映リクエスト」から追加してください。";
    $("#doneShelf").hidden = done.length === 0;
    if (state.filterChanged){ grid.scrollLeft = 0; gridDone.scrollLeft = 0; state.filterChanged = false; }
    updateSlides();
    if (state.openId) renderDetail();
  }

  // ---- 横スライド（パソコンは ‹ › ボタンで送れる） ----
  const bars = [...document.querySelectorAll(".slidebar")].map(bar => ({ bar, g: document.getElementById(bar.dataset.for) }));
  function updateSlides(){
    for (const { bar, g } of bars){
      bar.hidden = g.scrollWidth <= g.clientWidth + 2;
      bar.querySelector(".prev").disabled = g.scrollLeft <= 2;
      bar.querySelector(".next").disabled = g.scrollLeft + g.clientWidth >= g.scrollWidth - 2;
    }
  }
  for (const { bar, g } of bars){
    let raf = 0;
    g.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updateSlides); }, { passive: true });
    bar.querySelector(".prev").addEventListener("click", () => g.scrollBy({ left: -g.clientWidth * 0.8, behavior: "smooth" }));
    bar.querySelector(".next").addEventListener("click", () => g.scrollBy({ left: g.clientWidth * 0.8, behavior: "smooth" }));
  }
  window.addEventListener("resize", updateSlides);

  // ---- 詳細 ----
  function openDetail(id){ state.openId = id; $("#detailSheet").hidden = false; renderDetail(); }
  function renderDetail(){
    const m = state.movies.find(x => x.id === state.openId);
    if (!m){ closeSheets(); return; }
    const votes = votesOf(m), mine = state.me in votes;
    const names = Object.values(votes).map(n => n || "だれか");
    const rvs = reviewsOf(m);
    const prevT = $("#rvText");
    const keep = (prevT && state.rvFor === m.id) ? { v: prevT.value, f: document.activeElement === prevT, s: prevT.selectionStart } : null;
    const keepScroll = state.rvFor === m.id ? $("#dBody").scrollTop : 0;
    $("#dBody").innerHTML = `
      <button class="close" type="button" data-close aria-label="閉じる">×</button>
      <h2 id="dTitle">${esc(m.title)}</h2>
      ${dirOf(m) ? `<div class="meta">監督・作者：${esc(dirOf(m))}</div>` : ""}
      ${m.image_path ? `<img class="detail-img" src="${esc(imgSrc(m))}" alt="">` : ""}
      ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
      ${m.by_name ? `<div class="meta">${esc(m.by_name)} が追加</div>` : ""}
      ${names.length ? `<div class="vote-line"><span class="pops" aria-hidden="true">${popsHTML(names.length, 20)}</span><span>みたい：${names.map(esc).join("、")}</span></div>` : ""}
      <div class="row">
        <button class="btn" type="button" id="dVote">${mine ? "みたい済 ✓" : "わたしもみたい"}</button>
        <button class="sub-btn" type="button" id="dWatched">${m.watched ? "観た ✓" : "観た"}</button>
      </div>
      <div class="row">
        <button class="sub-btn" type="button" id="dAddImg">${m.image_path ? "画像を変える" : "画像を追加"}</button>${pasteControl()}
        <a class="link" href="${esc(searchUrl(m.title))}" target="_blank" rel="noopener">画像検索 ↗</a>
        ${m.created_by === state.me ? `<button class="sub-btn danger" type="button" id="dDel">削除</button>` : ""}
      </div>
      <section class="reviews">
        <h3>感想${rvs.length ? `<small>${rvs.length}件</small>` : ""}</h3>
        ${rvs.length ? rvs.map(r => `<div class="rv"><div class="rv-h"><b>${esc(r.name || "だれか")}</b><span>${fmtDate(r.created_at)}</span>${r.author_id === state.me ? `<button type="button" class="rv-del" data-rv="${esc(r.id)}">削除</button>` : ""}</div><p>${esc(r.body)}</p></div>`).join("") : `<p class="rv-empty">${reviewsReady() ? "まだ感想はありません。" : "感想の書き込みは準備中です。"}</p>`}
        ${reviewsReady() ? `<form class="rv-form" id="rvForm" novalidate><textarea id="rvText" rows="2" maxlength="1000" placeholder="感想を書く" aria-label="感想"></textarea><button class="btn" type="submit" id="rvBtn">書き込む</button></form>` : ""}
        <p class="err" id="rvErr" hidden></p>
      </section>
      <p class="err" id="dErr" hidden></p>`;
    if (keep){ const t = $("#rvText"); if (t){ t.value = keep.v; if (keep.f){ t.focus(); try { t.setSelectionRange(keep.s, keep.s); } catch(_){} } } }
    $("#dBody").scrollTop = keepScroll;
    state.rvFor = m.id;
    $("#dBody").querySelector("[data-close]").onclick = closeSheets;
    wirePaste($("#dBody"), f => attachImage(f), "detail");
    const rvErr = msg => { const e = $("#rvErr"); e.textContent = msg; e.hidden = false; };
    const rvForm = $("#rvForm");
    if (rvForm) rvForm.addEventListener("submit", e => {
      e.preventDefault();
      const body = $("#rvText").value.trim();
      if (!body){ $("#rvText").focus(); return; }
      const post = async () => {
        const btn = $("#rvBtn"); if (btn){ btn.disabled = true; btn.textContent = "送信中…"; }
        try { const t = $("#rvText"); if (t) t.value = ""; await addReview(m.id, body); }
        catch(err){ const t = $("#rvText"); if (t && !t.value) t.value = body; rvErr(saveError(err)); }
        finally { const b2 = $("#rvBtn"); if (b2){ b2.disabled = false; b2.textContent = "書き込む"; } }
      };
      state.myName ? post() : askName(post);
    });
    $("#dBody").querySelectorAll(".rv-del").forEach(b => b.addEventListener("click", async () => {
      if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "もう一度押すと削除"; return; }
      try { await delReview(b.dataset.rv); } catch(err){ rvErr(saveError(err)); }
    }));
    const err = msg => { const e = $("#dErr"); e.textContent = msg; e.hidden = false; };
    const vote = async () => {
      if (!state.sb) return err(saveError());
      const { data: cur, error: e1 } = await state.sb.from("movies").select("votes").eq("id", m.id).single();
      if (e1) return err(saveError());
      const v = { ...(cur.votes || {}) };
      const adding = !(state.me in v), vb = $("#dVote").getBoundingClientRect();
      if (!adding) delete v[state.me]; else v[state.me] = state.myName;
      const { error } = await state.sb.from("movies").update({ votes: v }).eq("id", m.id);
      if (error) return err(saveError());
      if (adding) popBurst(vb.left + vb.width / 2, vb.top + vb.height / 2, 12);
      await load();
    };
    $("#dVote").onclick = () => (mine || state.myName) ? vote() : askName(vote);
    $("#dWatched").onclick = async () => {
      const { error } = await state.sb.from("movies").update({ watched: !m.watched }).eq("id", m.id);
      if (error) return err(saveError());
      await load();
    };
    $("#dAddImg").onclick = () => { $("#addImg").value = ""; $("#addImg").click(); };
    const del = $("#dDel");
    if (del) del.onclick = async () => {
      if (del.dataset.confirm !== "1"){ del.dataset.confirm = "1"; del.textContent = "もう一度押すと削除"; return; }
      const { error } = await state.sb.from("movies").delete().eq("id", m.id);
      if (error) return err(saveError());
      if (m.image_path) { try { await state.sb.storage.from(BUCKET).remove([m.image_path]); } catch(_){} }
      closeSheets(); await load();
    };
  }

  // ---- 画像 ----
  async function shrink(file){
    if (file.type === "image/gif") return file;
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
      if (s === 1 && file.size < 1.5e6) return file;
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.86));
    } catch(_){ return file; }
  }
  async function uploadImage(file){
    const blob = await shrink(file);
    const ext = blob.type === "image/png" ? "png" : blob.type === "image/gif" ? "gif" : blob.type === "image/webp" ? "webp" : "jpg";
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await state.sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false });
    if (error) throw error;
    return path;
  }
  async function attachImage(file){
    const m = state.movies.find(x => x.id === state.openId);
    if (!m || !state.sb) return;
    const btn = $("#dAddImg"); if (btn){ btn.disabled = true; btn.textContent = "送信中…"; }
    try {
      const path = await uploadImage(file);
      const { error } = await state.sb.from("movies").update({ image_path: path }).eq("id", m.id);
      if (error) throw error;
      if (m.image_path) { try { await state.sb.storage.from(BUCKET).remove([m.image_path]); } catch(_){} }
      await load();
    } catch(_){
      const el = $("#dErr"); if (el){ el.textContent = saveError(); el.hidden = false; }
      if (btn){ btn.disabled = false; btn.textContent = "画像を追加"; }
    }
  }
  $("#addImg").addEventListener("change", e => { const f = e.target.files[0]; if (f && f.type.startsWith("image/")) attachImage(f); });

  // ---- 追加 ----
  function openPost(){
    $("#postForm").reset(); state.file = null; $("#thumb").style.backgroundImage = "";
    $("#dropText").innerHTML = desktop ? `ポスター画像 <small>任意・${pasteKey} で貼り付けOK</small>` : "ポスター画像 <small>任意</small>";
    $("#fName").value = state.myName; $("#postErr").hidden = true; updateFind();
    showNameRow(!state.myName);
    $("#postSheet").hidden = false;
    // スマホではキーボードで画面が隠れないよう、自動でカーソルを置かない
    if (matchMedia("(pointer:fine)").matches) setTimeout(() => (state.myName ? $("#fTitle") : $("#fName")).focus(), 30);
  }
  function showNameRow(edit){
    $("#nameRow").hidden = !edit; $("#asRow").hidden = edit;
    $("#asName").textContent = state.myName;
  }
  $("#asChange").addEventListener("click", () => { showNameRow(true); $("#fName").focus(); });
  function updateFind(){
    const t = $("#fTitle").value.trim(), a = $("#findLink");
    if (t){ a.href = searchUrl(t); a.setAttribute("aria-disabled","false"); } else { a.href = "#"; a.setAttribute("aria-disabled","true"); }
  }
  $("#fTitle").addEventListener("input", updateFind);
  function closeSheets(){ document.querySelectorAll(".sheet-bg").forEach(s => s.hidden = true); state.openId = null; state.rvFor = null; }
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheets));
  document.querySelectorAll(".sheet-bg").forEach(bg => bg.addEventListener("click", e => { if (e.target === bg) closeSheets(); }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });
  $("#openPost").addEventListener("click", openPost);

  const drop = $("#drop"), fImg = $("#fImg");
  drop.addEventListener("click", () => fImg.click());
  drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fImg.click(); } });
  fImg.addEventListener("change", () => fImg.files[0] && pick(fImg.files[0]));
  drop.addEventListener("dragover", e => e.preventDefault());
  drop.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) pick(f); });
  // ---- コピーした画像の貼り付け（パソコン向け） ----
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const pasteKey = isMac ? "⌘V" : "Ctrl+V";
  const desktop = matchMedia("(pointer:fine)").matches;
  function dataUrlToFile(url){
    const m = url.match(/^data:(image\/[\w+.-]+);base64,(.*)$/); if (!m) return null;
    const bin = atob(m[2]); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], "pasted." + (m[1].split("/")[1] || "png"), { type: m[1] });
  }
  // クリップボードの中身から画像を取り出す（画像そのもの → HTML内の埋め込み画像の順に探す）
  function imageFromClipboard(dt){
    if (!dt) return { file: null, hasImgLink: false };
    const f1 = [...(dt.files || [])].find(f => f.type.startsWith("image/"));
    if (f1) return { file: f1 };
    const it = [...(dt.items || [])].find(i => i.kind === "file" && i.type.startsWith("image/"));
    const f2 = it && it.getAsFile(); if (f2) return { file: f2 };
    const html = dt.getData ? dt.getData("text/html") : "";
    const m = html && html.match(/<img[^>]+src=["'](data:image\/[^"']+)["']/i);
    if (m){ const f3 = dataUrlToFile(m[1]); if (f3) return { file: f3 }; }
    return { file: null, hasImgLink: !!(html && /<img[^>]+src=["']https?:/i.test(html)) };
  }
  function pasteHint(where){
    const msg = `画像そのものをコピーしてください（画像を右クリック →「画像をコピー」→ ${pasteKey}）。`;
    if (where === "post") showPostErr(msg);
    else { const el = $("#dErr"); if (el){ el.textContent = msg; el.hidden = false; } }
  }
  document.addEventListener("paste", e => {
    const postOpen = !$("#postSheet").hidden, detailOpen = !$("#detailSheet").hidden;
    if (!postOpen && !detailOpen) return;
    const { file, hasImgLink } = imageFromClipboard(e.clipboardData);
    if (file){
      e.preventDefault();
      if (postOpen) pick(file); else attachImage(file);
      return;
    }
    // 文字入力欄への普通の貼り付けは邪魔しない
    const tag = (e.target && e.target.tagName) || "";
    if (hasImgLink && tag !== "INPUT" && tag !== "TEXTAREA") pasteHint(postOpen ? "post" : "detail");
  });
  // ---- 「貼り付け」ボタン（パソコン・スマホ共通） ----
  // クリップボードを読めるブラウザはボタンを押すだけ。読めないスマホは「長押し →ペースト」で貼る
  const canReadClip = true && !!(navigator.clipboard && typeof navigator.clipboard.read === "function");
  const touch = matchMedia("(pointer:coarse)").matches;
  const ZONE = `<div class="paste pastezone" contenteditable="true" inputmode="none" role="textbox" aria-label="長押しして画像を貼り付け" data-pastezone>長押しで貼り付け</div>`;
  function pasteControl(){
    if (canReadClip) return `<button type="button" class="paste" data-paste>貼り付け</button>`;
    return touch ? ZONE : "";
  }
  function msg(where, text){
    if (where === "post") showPostErr(text);
    else { const el = $("#dErr"); if (el){ el.textContent = text; el.hidden = false; } }
  }
  async function readClipImage(){
    const items = await navigator.clipboard.read();
    for (const item of items){
      const type = item.types.find(t => t.startsWith("image/"));
      if (type){ const blob = await item.getType(type); return new File([blob], "pasted." + type.split("/")[1], { type }); }
      if (item.types.includes("text/html")){
        const html = await (await item.getType("text/html")).text();
        const m = html.match(/<img[^>]+src=["'](data:image\/[^"']+)["']/i);
        if (m){ const f = dataUrlToFile(m[1]); if (f) return f; }
      }
    }
    return null;
  }
  function wirePaste(root, onFile, where){
    root.querySelectorAll("[data-paste]").forEach(b => b.addEventListener("click", async () => {
      try { const f = await readClipImage(); if (f) onFile(f); else pasteHint(where); }
      catch(_){
        if (touch){
          // 読み取りを断られたら長押し方式に切り替える
          b.outerHTML = ZONE; wirePaste(root, onFile, where);
          msg(where, "「長押しで貼り付け」を長押しして「ペースト」を選んでください。");
        } else msg(where, `貼り付けを許可されませんでした。${pasteKey} で貼り付けてください。`);
      }
    }));
    root.querySelectorAll("[data-pastezone]").forEach(z => {
      if (z.dataset.wired) return; z.dataset.wired = "1";
      const reset = () => { if (z.textContent !== "長押しで貼り付け") z.textContent = "長押しで貼り付け"; };
      z.addEventListener("beforeinput", e => { if (e.inputType !== "insertFromPaste") e.preventDefault(); });
      z.addEventListener("input", reset);
      z.addEventListener("paste", () => setTimeout(() => { reset(); z.blur(); }, 0));
    });
  }
  $("#pasteSlot").innerHTML = pasteControl();
  wirePaste($("#postForm"), f => pick(f), "post");
  function pick(f){
    if (!f.type.startsWith("image/")) { showPostErr("画像ファイルを選んでください。"); return; }
    state.file = f;
    $("#thumb").style.backgroundImage = `url("${URL.createObjectURL(f)}")`;
    $("#dropText").textContent = f.name || "貼り付けた画像";
    $("#postErr").hidden = true;
  }
  function showPostErr(msg){ const e = $("#postErr"); e.textContent = msg; e.hidden = false; }
  $("#postForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#fName").value.trim(), title = $("#fTitle").value.trim();
    if (!name) { showPostErr("名前を入れてください。"); $("#fName").focus(); return; }
    if (!title) { showPostErr("タイトルを入れてください。"); $("#fTitle").focus(); return; }
    if (!state.sb) { showPostErr(saveError()); return; }
    setName(name);
    const btn = $("#postBtn"); btn.disabled = true; btn.textContent = "送信中…";
    try {
      const image_path = state.file ? await uploadImage(state.file) : null;
      const { error } = await state.sb.from("movies").insert({
        title, year: $("#fDir").value.trim(), note: $("#fNote").value.trim(), image_path,
        by_name: name, created_by: state.me, votes: { [state.me]: name }, watched: false
      });
      if (error) throw error;
      closeSheets(); celebrate(); await load();
    } catch(_){ showPostErr(saveError()); }
    finally { btn.disabled = false; btn.textContent = "リクエストする"; }
  });

  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    state.filter = b.dataset.f; state.filterChanged = true;
    document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === b));
    render();
  }));

  // ---- 接続 ----
  async function load(){
    let { data, error } = await state.sb.from("movies").select("*, reviews(*)").order("created_at", { ascending: false }).limit(500);
    if (error){
      // 感想用の表がまだ無いときは、映画だけ読み込む
      ({ data, error } = await state.sb.from("movies").select("*").order("created_at", { ascending: false }).limit(500));
      if (error) throw error;
      state.noReviews = true;
    } else state.noReviews = false;
    state.movies = data || [];
    render();
  }
  renderWho();
  (async function boot(){
    const notice = $("#notice");
    if (!window.supabase){ $("#count").textContent = ""; notice.textContent = "読み込めませんでした。ページを開き直してください。"; notice.hidden = false; return; }
    state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    try { await load(); }
    catch(_){ $("#count").textContent = ""; notice.textContent = "リストを読み込めませんでした。ページを開き直してください。"; notice.hidden = false; return; }
    let t = null;
    const refresh = () => { clearTimeout(t); t = setTimeout(() => load().catch(() => {}), 250); };
    state.sb.channel("movies").on("postgres_changes", { event: "*", schema: "public", table: "movies" }, refresh).on("postgres_changes", { event: "*", schema: "public", table: "reviews" }, refresh).subscribe();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  })();
})();
</script>
</body>
